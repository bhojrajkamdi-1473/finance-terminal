<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Terminal — Institutional Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/terminal/styles.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to workspace</a>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-mark">FT</span> FINANCE TERMINAL <small>EQUITY RESEARCH</small></div>
    <div class="search-wrap">
      <input id="global-search" type="text" aria-label="Global security search" placeholder="Search company, ticker, sector, index…  ( / )" autocomplete="off" spellcheck="false">
      <div id="search-results" class="search-results hidden" role="listbox"></div>
    </div>
    <div class="topbar-right">
      <span id="data-status" class="pill pill-live" title="Market data provider status">DELAYED · YAHOO</span>
      <button class="btn sm" id="top-refresh" title="Reload current view" aria-label="Refresh current view">Refresh</button>
      <a class="btn sm" href="#/settings" aria-label="Open settings">Settings</a>
      <span id="clock" class="clock"></span>
    </div>
  </header>
  <div id="shell">
    <nav id="sidenav" aria-label="Terminal sections"></nav>
    <main id="view"></main>
  </div>
  <div id="toast-root"></div>
</div>
<script src="/terminal/js/format.js"></script>
<script src="/terminal/js/viz.js"></script>
<script src="/terminal/js/interpret.js"></script>
<script src="/terminal/js/api.js"></script>
<script src="/terminal/js/charts.js"></script>
<script src="/terminal/js/analysis.js"></script>
<script src="/terminal/js/pages.js"></script>
<script src="/terminal/js/ai_research.js"></script>
<script src="/terminal/js/company.js"></script>
<script src="/terminal/js/app.js"></script>
<script src="/terminal/js/shell.js"></script>
</body>
</html>
