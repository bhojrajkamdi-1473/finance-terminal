<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINSIGHT — Financial Intelligence, Reconciled</title>
<link rel="icon" type="image/svg+xml" href="/terminal/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/terminal/styles.css?v=4">
</head>
<body data-theme="dark">
<a class="skip-link" href="#view">Skip to workspace</a>
<div id="app">
  <header id="topbar">
    <a class="fi-brand" href="#/welcome" aria-label="FINSIGHT home">
      <svg class="fi-mark" width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="6" fill="#0C1624"/><path d="M20 14h26v7H29v8h15v7H29v14h-9V14z" fill="#C49A3C"/><rect x="20" y="50" width="26" height="3" fill="#C49A3C" opacity="0.45"/></svg>
      <span class="fi-name">FINSIGHT<small>FINANCIAL INTELLIGENCE, RECONCILED</small></span>
    </a>
    <div class="search-wrap">
      <input id="global-search" type="text" aria-label="Global security search" placeholder="Search company, stock, index or symbol…  ( / )" autocomplete="off" spellcheck="false">
      <div id="search-results" class="search-results hidden" role="listbox"></div>
    </div>
    <div class="topbar-right">
      <span id="data-status" class="pill pill-live" title="Market data provider status">DELAYED · YAHOO</span>
      <button class="btn sm" id="top-theme" title="Toggle light / dark workspace" aria-label="Toggle theme">Theme</button>
      <button class="btn sm" id="top-refresh" title="Reload current view" aria-label="Refresh current view">Refresh</button>
      <a class="btn sm" href="#/settings" aria-label="Open settings">Settings</a>
      <button class="topbar-profile" id="top-profile" title="Local workspace profile (this device only)"><span class="avatar" id="profile-initial">–</span><span id="profile-name">Profile</span></button>
      <span id="clock" class="clock"></span>
    </div>
  </header>
  <div id="shell">
    <nav id="sidenav" aria-label="Terminal sections"></nav>
    <main id="view"></main>
  </div>
  <div id="toast-root"></div>
</div>
<script src="/terminal/js/fs-config.js"></script>
<script src="/terminal/js/fs-api.js"></script>
<script src="/terminal/js/fs-state.js"></script>
<script src="/terminal/js/fs-charts.js"></script>
<script src="/terminal/js/format.js"></script>
<script src="/terminal/js/viz.js"></script>
<script src="/terminal/js/interpret.js"></script>
<script src="/terminal/js/api.js"></script>
<script src="/terminal/js/charts.js"></script>
<script src="/terminal/js/analysis.js"></script>
<script src="/terminal/js/pages.js"></script>
<script src="/terminal/js/ai_research.js"></script>
<script src="/terminal/js/company.js"></script>
<script src="/terminal/js/app.js"></script>
<script src="/terminal/js/shell.js"></script>
</body>
</html>
